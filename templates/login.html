{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="{{ url_for('login') }}" novalidate class="auth">
  <label>Email <input type="email" name="email" value="{{ data.get('email','') }}"></label>
  {% if errors.get('email') %}<span class="error">{{ errors['email'] }}</span>{% endif %}
  <label>Password <input type="password" name="password"></label>
  {% if errors.get('password') %}<span class="error">{{ errors['password'] }}</span>{% endif %}
  <button type="submit">Log in</button>
</form>
<p>No account? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
{% endblock %}
